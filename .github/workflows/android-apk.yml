name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main, 'codex/android-apk']
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify test APK
        shell: bash
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          bash android-app/build.sh
          sha256sum android-app/build/cloud-mail-0.1.0-debug.apk > android-app/build/SHA256SUMS
      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-mail-android-debug-${{ github.run_number }}
          path: |
            android-app/build/cloud-mail-0.1.0-debug.apk
            android-app/build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
