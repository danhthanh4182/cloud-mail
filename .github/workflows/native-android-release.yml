name: Signed Android release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: python3 scripts/harness.py verify
      - name: Verify Flutter
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build with the configured release certificate
        working-directory: apps/mobile
        shell: bash
        env:
          CLOUD_MAIL_KEYSTORE_BASE64: ${{ secrets.CLOUD_MAIL_KEYSTORE_BASE64 }}
          CLOUD_MAIL_SIGNING_STORE_PASSWORD: ${{ secrets.CLOUD_MAIL_SIGNING_STORE_PASSWORD }}
          CLOUD_MAIL_SIGNING_KEY_ALIAS: ${{ secrets.CLOUD_MAIL_SIGNING_KEY_ALIAS }}
          CLOUD_MAIL_SIGNING_KEY_PASSWORD: ${{ secrets.CLOUD_MAIL_SIGNING_KEY_PASSWORD }}
          CLOUD_MAIL_SIGNING_CERT_SHA256: ${{ vars.CLOUD_MAIL_SIGNING_CERT_SHA256 }}
          CLOUD_MAIL_FCM_APP_ID: ${{ vars.CLOUD_MAIL_FCM_APP_ID }}
          CLOUD_MAIL_FCM_API_KEY: ${{ vars.CLOUD_MAIL_FCM_API_KEY }}
          CLOUD_MAIL_FCM_PROJECT_ID: ${{ vars.CLOUD_MAIL_FCM_PROJECT_ID }}
          CLOUD_MAIL_FCM_SENDER_ID: ${{ vars.CLOUD_MAIL_FCM_SENDER_ID }}
        run: |
          umask 077
          : "${CLOUD_MAIL_KEYSTORE_BASE64:?Missing Android release keystore}"
          : "${CLOUD_MAIL_SIGNING_STORE_PASSWORD:?Missing Android release store password}"
          : "${CLOUD_MAIL_SIGNING_KEY_ALIAS:?Missing Android release key alias}"
          : "${CLOUD_MAIL_SIGNING_KEY_PASSWORD:?Missing Android release key password}"
          : "${CLOUD_MAIL_SIGNING_CERT_SHA256:?Missing expected certificate fingerprint}"
          export CLOUD_MAIL_SIGNING_STORE="$RUNNER_TEMP/cloud-mail-release.jks"
          trap 'rm -f "$CLOUD_MAIL_SIGNING_STORE"' EXIT
          printf '%s' "$CLOUD_MAIL_KEYSTORE_BASE64" | base64 -d > "$CLOUD_MAIL_SIGNING_STORE"
          unset CLOUD_MAIL_KEYSTORE_BASE64
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p ../../native-release-artifact
          target=../../native-release-artifact/cloud-mail-native-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "$target"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$target" > ../../native-release-artifact/signature.txt
          actual=$(awk -F': ' '/certificate SHA-256 digest:/{print tolower($2)}' ../../native-release-artifact/signature.txt)
          expected=$(printf '%s' "$CLOUD_MAIL_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          (cd ../../native-release-artifact && sha256sum *.apk > SHA256SUMS)
          printf 'source=%s\nkind=signed release candidate\n' "$GITHUB_SHA" > ../../native-release-artifact/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-mail-native-release-${{ github.sha }}
          path: native-release-artifact/
          if-no-files-found: error
          retention-days: 14
