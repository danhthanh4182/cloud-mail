name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install worker dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: Install vue dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-vue

      - name: Build vue
        run: pnpm run build
        working-directory: ./mail-vue

      - name: Run worker unit tests
        run: pnpm test
        working-directory: ./mail-worker

      - name: Run worker runtime tests
        run: pnpm test:worker
        working-directory: ./mail-worker

      - name: Audit worker dependencies
        run: pnpm audit --prod
        working-directory: ./mail-worker
        continue-on-error: true

      - name: Audit vue dependencies
        run: pnpm audit --prod
        working-directory: ./mail-vue
        continue-on-error: true

      - name: License gate (worker)
        run: pnpm licenses list --prod --json | jq -e '[keys[] | select(test("AGPL|GPL"; "i"))] | length == 0'
        working-directory: ./mail-worker

      - name: License gate (vue)
        run: pnpm licenses list --prod --json | jq -e '[keys[] | select(test("AGPL|GPL"; "i"))] | length == 0'
        working-directory: ./mail-vue
